# Protocolo común. Las configs de modelo solo sobreescriben model.name.
# Rutas relativas a la raíz del repo; data/ es el symlink a ~/data/isic2019.

data:
  root: data
  train_dir: data/img256/train
  test_dir: data/img256/test
  splits_dir: results/splits
  classes: [MEL, NV, BCC, AK, BKL, DF, VASC, SCC]
  num_classes: 8
  resize: 256
  crop: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

split:
  seed: 42
  folds: 20
  train_folds: 14
  val_folds: 3
  test_folds: 3

augment:
  crop_scale: [0.7, 1.0]
  hflip: 0.5
  vflip: 0.5
  rotation: 20
  brightness: 0.1
  contrast: 0.1

model:
  name: null
  pretrained: true

train:
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 1.0e-2
  warmup_epochs: 1
  scheduler: cosine
  max_epochs: 15
  patience: 3
  monitor: val_f1_macro
  batch_size: 32
  num_workers: 8
  pin_memory: true
  amp_dtype: bfloat16
  cudnn_benchmark: true
  loss: weighted_cross_entropy

seed: 0
seeds: [0, 1, 2]
out_dir: runs

smoke:
  n_train: 500
  n_val: 100
  epochs: 1
